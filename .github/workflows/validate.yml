name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Repository self-check (skills, manifests, secrets)
        run: node scripts/validate.mjs
      - name: Hook scripts unit tests
        run: node --test "plugins/openplatform/hooks/test/*.test.mjs" "plugins/openplatform/skills/openplatform-ext-init/scripts/*.test.mjs"
      - name: '@finamx imports exist in the published npm packages'
        run: |
          npm i --no-save --no-audit --no-fund --no-package-lock @finamx/host-bridge@latest @finamx/extension-sdk@latest @finamx/bridge-protocol@latest jose@6 react@19 react-dom@19
          node scripts/check-imports.mjs
      - name: Published CLI and Flow V2 example
        run: |
          node scripts/check-cli.mjs
          node --test scripts/check-flow-example.test.mjs scripts/check-s2s-cli.test.mjs
      - name: Claude Code marketplace and plugin validation
        run: |
          npx -y @anthropic-ai/claude-code plugin validate .
          npx -y @anthropic-ai/claude-code plugin validate ./plugins/openplatform
